<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0F14">
<title>Battery Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0B0F14; --panel: #131920; --border: #232B34;
    --text: #E8EDF2; --text-dim: #8B98A5;
    --amber: #F5A623; --teal: #2DD4BF; --red: #EF4444; --green: #4ADE80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 40px; }
  .mono { font-family: 'Space Mono', monospace; }

  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
  }
  .device-name { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  .device-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .status-pill {
    display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid;
  }
  .status-pill.online { color: var(--green); border-color: rgba(74,222,128,0.35); background: rgba(74,222,128,0.08); }
  .status-pill.offline { color: var(--red); border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.08); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-pill.online .dot { animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .flow-indicator {
    display: inline-flex; align-items: center; gap: 5px; margin: 16px 20px 0;
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 5px 12px; border-radius: 20px; width: fit-content;
  }
  .flow-indicator.charging { color: var(--amber); background: rgba(245,166,35,0.1); }
  .flow-indicator.discharging { color: var(--teal); background: rgba(45,212,191,0.1); }
  .flow-indicator.idle { color: var(--text-dim); background: rgba(139,152,165,0.1); }

  .main-section { padding: 20px; }
  .main-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  .watts-big { text-align: center; padding-bottom: 20px; }
  .watts-value { font-size: 48px; font-weight: 700; }
  .watts-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
  .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; }
  .stat-row + .stat-row { border-top: 1px solid var(--border); }
  .stat-label { font-size: 13px; color: var(--text-dim); }
  .stat-value { font-size: 18px; font-weight: 700; }

  .section-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin: 24px 20px 10px;
  }
  .chart-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 12px; margin: 0 20px 16px; height: 220px;
  }
  .range-tabs { display: flex; gap: 8px; padding: 0 20px; margin-top: 8px; }
  .range-tab { font-size: 11px; font-weight: 700; color: var(--text-dim); background: var(--panel); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; }
  .range-tab.active { color: var(--bg); background: var(--text); }

  .footer-note { padding: 24px 20px 8px; font-size: 11px; color: var(--text-dim); text-align: center; }
</style>
</head>
<body>

  <div class="statusbar">
    <div>
      <div class="device-name">Battery Sensor Test</div>
      <div class="device-sub" id="lastSeen">Loading...</div>
    </div>
    <div class="status-pill offline" id="statusPill">
      <span class="dot"></span><span id="statusText">Checking</span>
    </div>
  </div>

  <div class="flow-indicator idle" id="flowIndicator">Idle</div>

  <div class="main-section">
    <div class="main-panel">
      <div class="watts-big">
        <div class="watts-value mono" id="wValue">-- W</div>
        <div class="watts-label">Net Power</div>
      </div>
      <div class="stat-row"><span class="stat-label">Voltage</span><span class="stat-value mono" id="vValue">-- V</span></div>
      <div class="stat-row"><span class="stat-label">Current</span><span class="stat-value mono" id="aValue">-- A</span></div>
    </div>
  </div>

  <div class="range-tabs">
    <div class="range-tab active" data-days="1">24H</div>
    <div class="range-tab" data-days="7">7D</div>
    <div class="range-tab" data-days="30">30D</div>
  </div>

  <div class="section-title">Power (Watts)</div>
  <div class="chart-card"><canvas id="powerChart"></canvas></div>

  <div class="section-title">Voltage &amp; Current</div>
  <div class="chart-card"><canvas id="vaChart"></canvas></div>

  <div class="footer-note">Auto-refreshes every 30 seconds</div>

<script>
  const CHANNEL_ID = "3441461";
  const READ_API_KEY = "LTGB9LLFL0KDKNGA";
  const OFFLINE_THRESHOLD_MINUTES = 1.5;

  let powerChart, vaChart;
  let currentRangeDays = 1;

  function feedUrl(p) {
    return `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_API_KEY}&${p}`;
  }

  async function fetchLatest() {
    try {
      const res = await fetch(feedUrl("results=1"));
      const data = await res.json();
      if (!data.feeds || data.feeds.length === 0) return;
      const f = data.feeds[0];
      updateStatus(f.created_at);
      updateReadout(f);
    } catch (e) {
      console.error("Failed to fetch latest:", e);
      setOffline();
    }
  }

  function updateStatus(createdAt) {
    const lastTime = new Date(createdAt);
    const minutesAgo = (new Date() - lastTime) / 60000;
    document.getElementById("lastSeen").textContent =
      "Last update: " + lastTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second: '2-digit'});
    if (minutesAgo <= OFFLINE_THRESHOLD_MINUTES) {
      document.getElementById("statusPill").className = "status-pill online";
      document.getElementById("statusText").textContent = "Online";
    } else {
      setOffline();
    }
  }

  function setOffline() {
    document.getElementById("statusPill").className = "status-pill offline";
    document.getElementById("statusText").textContent = "Offline";
  }

  function updateReadout(f) {
    const v = parseFloat(f.field1) || 0;
    const a = parseFloat(f.field2) || 0;
    const w = parseFloat(f.field3) || 0;

    document.getElementById("vValue").textContent = v.toFixed(2) + " V";
    document.getElementById("aValue").textContent = a.toFixed(3) + " A";
    document.getElementById("wValue").textContent = w.toFixed(2) + " W";

    const el = document.getElementById("flowIndicator");
    if (a > 0.05) { el.className = "flow-indicator charging"; el.textContent = "Charging"; }
    else if (a < -0.05) { el.className = "flow-indicator discharging"; el.textContent = "Discharging"; }
    else { el.className = "flow-indicator idle"; el.textContent = "Idle"; }
  }

  async function fetchHistory(days) {
    try {
      const res = await fetch(feedUrl(`days=${days}`));
      const data = await res.json();
      if (data.feeds) renderCharts(data.feeds);
    } catch (e) { console.error("Failed to fetch history:", e); }
  }

  function renderCharts(feeds) {
    const labels = feeds.map(f => {
      const d = new Date(f.created_at);
      return currentRangeDays <= 1
        ? d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        : d.toLocaleDateString([], {month:'short', day:'numeric'}) + " " + d.toLocaleTimeString([], {hour:'2-digit'});
    });
    const v = feeds.map(f => parseFloat(f.field1) || null);
    const a = feeds.map(f => parseFloat(f.field2) || null);
    const w = feeds.map(f => parseFloat(f.field3) || null);

    const commonOpts = {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { labels: { color: '#8B98A5', font: { size: 10 } } } },
      scales: {
        x: { ticks: { color: '#8B98A5', maxTicksLimit: 6, font: { size: 9 } }, grid: { color: '#232B34' } },
        y: { ticks: { color: '#8B98A5', font: { size: 9 } }, grid: { color: '#232B34' } }
      }
    };

    if (powerChart) powerChart.destroy();
    powerChart = new Chart(document.getElementById('powerChart'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'Watts', data: w, borderColor: '#4ADE80', backgroundColor: 'rgba(74,222,128,0.1)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 }] },
      options: commonOpts
    });

    if (vaChart) vaChart.destroy();
    vaChart = new Chart(document.getElementById('vaChart'), {
      type: 'line',
      data: { labels, datasets: [
        { label: 'Voltage', data: v, borderColor: '#F5A623', tension: 0.3, pointRadius: 0, borderWidth: 2, yAxisID: 'y' },
        { label: 'Current', data: a, borderColor: '#2DD4BF', tension: 0.3, pointRadius: 0, borderWidth: 2, yAxisID: 'y1' }
      ]},
      options: {
        ...commonOpts,
        scales: {
          ...commonOpts.scales,
          y: { ...commonOpts.scales.y, position: 'left' },
          y1: { ...commonOpts.scales.y, position: 'right', grid: { display: false } }
        }
      }
    });
  }

  document.querySelectorAll('.range-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.range-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentRangeDays = parseInt(tab.dataset.days);
      fetchHistory(currentRangeDays);
    });
  });

  fetchLatest();
  fetchHistory(currentRangeDays);
  setInterval(fetchLatest, 30000);
  setInterval(() => fetchHistory(currentRangeDays), 300000);
</script>

</body>
</html>
